function analysis(img){

 let h=0,t=0;function across(i,fn){if(i%W)fn(i-1);if(i%W<W-1)fn(i+1);if(i>=W)fn(i-W);if(i<n-W)fn(i+W)}
 function flood(i){if(seen[i])return;let j=i*4;if(src[j+3]<12||(bg[3]&&Math.max(...[0,1,2].map(k=>Math.abs(src[j+k]-bg[k])))<32)){seen[i]=1;Q[t++]=i}}
 for(let i=0;i<n;i++)if(i<W||i>=n-W||i%W===0||i%W===W-1)flood(i);
 while(h<t)across(Q[h++],flood);
 if(bg[3])for(let i=0;i<n;i++){let j=i*4;if(Math.max(Math.abs(src[j]-bg[0]),Math.abs(src[j+1]-bg[1]),Math.abs(src[j+2]-bg[2]))<3)seen[i]=1}
 mask=new Int16Array(n);mask.fill(-1);let comps=[];for(let i=0;i<n;i++){if(seen[i]||src[i*4+3]<12)continue;h=0;t=1;Q[0]=i;seen[i]=1;while(h<t)across(Q[h++],j=>{if(!seen[j]&&src[j*4+3]>=12){seen[j]=1;Q[t++]=j}});if(t>=5)comps.push(Q.slice(0,t))}
 comps.sort((a,b)=>b.length-a.length);if(!comps.length)throw Error('Não encontrei uma silhueta. Use um PNG transparente.');
 let main=comps.filter(c=>c.length>=Math.max(30,comps[0].length*.035)).slice(0,8);if(!main.length)throw Error('Imagem pequena demais para identificar as articulações.');
 groups=main.map((ids,id)=>{let l=W,r=0,u=H,b=0;for(let i of ids){let x=i%W,y=i/W|0;l=Math.min(l,x);r=Math.max(r,x);u=Math.min(u,y);b=Math.max(b,y);mask[i]=id}return {id,ids,l,r,u,b}});
 // Attach small detached accessories to the closest silhouette.
 for(const a of comps.filter(a=>!main.includes(a))){let x=a[0]%W,y=a[0]/W|0;let g=groups.reduce((p,g)=>boxdist(g,x,y)<boxdist(p,x,y)?g:p);let joined=new Int32Array(g.ids.length+a.length);joined.set(g.ids);joined.set(a,g.ids.length);g.ids=joined;for(let i of a){mask[i]=g.id;let X=i%W,Y=i/W|0;g.l=Math.min(g.l,X);g.r=Math.max(g.r,X);g.u=Math.min(g.u,Y);g.b=Math.max(g.b,Y)}}

}
function boxdist(g,x,y){return (x-clamp(x,g.l,g.r))**2+(y-clamp(y,g.u,g.b))**2}
function dist(a,b){return Math.max(...a.map((v,i)=>Math.abs(v-b[i])))}

 const P=(x,y)=>pt(g.l+(flip?1-x:x)*(w-1),g.u+y*(h-1));

 function add(p){g.points.push(p);return g.points.length-1}
 function chain(type,sign,coords){g.chains.push({type,sign,idx:coords.map(add)})}
